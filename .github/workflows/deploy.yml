name: CI/CD Pipeline Lab 8

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Сборка проекта
        run: mvn clean package -Dspring.profiles.active=test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на Render
        # Если секрет еще не настроен, этот шаг просто отправит запрос, когда ты его добавишь
        run: |
          if [ "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" != "" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "Секрет RENDER_DEPLOY_HOOK_URL пока не добавлен, пропускаем."
          fi

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Проверка работоспособности сайта
        # Просто проверяем, что твой живой бэкенд в облаке отвечает. Он вернет [], шаг станет зеленым!
        run: curl --fail https://librarymanagement-nxl6.onrender.com/api/authors || exit 1