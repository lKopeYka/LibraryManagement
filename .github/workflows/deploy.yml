name: CI/CD Pipeline
on:
  push:
    branches: [ main, master ]

jobs:
  # 1. Отдельный этап для тестирования
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Настройка Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Запуск тестов
        run: mvn test

  # 2. Этап сборки (зависит от успешного прохождения тестов)
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка проекта
        run: mvn clean package -DskipTests

  # 3. Деплой (зависит от успешной сборки)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на Render
        run: |
          if [ "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" != "" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "Секрет RENDER_DEPLOY_HOOK_URL пока не добавлен."
          fi

  # 4. Проверка (зависит от деплоя)
  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Проверка работоспособности
        run: curl --fail https://librarymanagement-nx16.onrender.com/api/authors || exit 1